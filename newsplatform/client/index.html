<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="robots" content="index, follow" />
    <meta name="googlebot" content="index, follow" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />

    <!-- Google AdSense - REPLACE ca-pub-xxx with your Publisher ID -->
    <!-- <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX" crossorigin="anonymous"></script> -->

    <!-- Default SEO - gets overridden by React Helmet per page -->
    <title>IndiaInk — News, Business & Culture</title>
    <meta name="description" content="Premium journalism for modern India. Covering tech, business, law, and culture with depth and clarity." />
    <meta name="keywords" content="india news, technology news, business news, viral news, law news, hindi news, latest news india" />

    <!-- Open Graph -->
    <meta property="og:site_name" content="IndiaInk" />
    <meta property="og:locale" content="en_IN" />

    <!-- Schema.org structured data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "NewsMediaOrganization",
      "name": "IndiaInk",
      "url": "https://indiaink.com",
      "logo": "https://indiaink.com/logo.png",
      "description": "Premium journalism for modern India",
      "sameAs": ["https://twitter.com/indiaink", "https://instagram.com/indiaink"]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
